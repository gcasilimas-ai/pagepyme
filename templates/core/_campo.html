<div class="campo{% if field.errors %} con-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} campo-check{% endif %}{% if ancho or field.field.widget.input_type == 'textarea' or field.name == 'observaciones' or field.name == 'comentario' %} ancho{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label>{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="ayuda-campo">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="error-campo">{{ e }}</p>{% endfor %}
</div>
